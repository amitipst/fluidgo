name: CI

# Blocking quality gate. Runs on every pull request and on pushes to
# develop/main. Make the single "CI Gate" job a required status check in
# branch protection so nothing merges unless every check below is green.
#
# Replaces the old non-blocking "Test Suite" job in release.yml, which ran a
# stale script (vertical_slice_test.py) and was marked continue-on-error.
# The deploy pipeline (release.yml) is changed separately.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fluidgo_ci
          POSTGRES_USER: fluidgo
          POSTGRES_PASSWORD: ci_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluidgo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fluidgo:ci_test_pass@localhost:5432/fluidgo_ci
      JWT_SECRET: ci-test-secret-not-for-production
      OLLAMA_URL: http://localhost:11434
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as backend/Dockerfile.prod
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alembic has exactly one head
        run: |
          heads=$(alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          alembic heads
          test "$heads" -eq 1 || { echo "::error::Expected one Alembic head, found $heads (two branches both added a migration with the same parent)"; exit 1; }

      - name: Migrations apply on an empty database
        run: alembic upgrade head

      - name: Last migration is reversible
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Unit tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"        # same as frontend/Dockerfile.prod
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build         # tsc && vite build

  version-sync:
    name: Version strings agree
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_version_sync.py

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, version-sync]
    if: always()
    steps:
      - name: All required checks passed
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} version-sync=${{ needs.version-sync.result }}"
          test "${{ needs.backend.result }}" = "success" \
            && test "${{ needs.frontend.result }}" = "success" \
            && test "${{ needs.version-sync.result }}" = "success"
