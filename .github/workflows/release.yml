name: fluidGo Release Pipeline

# ══════════════════════════════════════════════════════════════════════════════
# v3 (2026-10-14): this workflow NO LONGER TESTS OR DEPLOYS.
# ─────────────────────────────────────────────────────────────────────────────
# Production deploys run on the EC2 box with scripts/deploy.sh (backup, CI gate,
# build, swap, health check, automatic rollback) and scripts/rollback.sh,
# started from the VS Code SSH session. GitHub Actions is not relied on because
# the free account's Actions runs can be blocked by billing, and the old Deploy
# job here ran plain `docker compose` + `git reset --hard` with no backup, which
# must never fire against production.
#
# What is left: pushing a tag vX.Y.Z creates a GitHub Release with notes.
# ══════════════════════════════════════════════════════════════════════════════
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  # ════════════════════════════════════════════════════════════════════════
  tag-release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## fluidGo ${{ github.ref_name }}

            This tag marks the commit already deployed to production as part
            of the `main` branch push that included it — see the Deploy job
            on that commit's workflow run for the actual deploy log.

            **Branching model:**
            - `main` — stable line. Patch releases only (this tag + future
              `v1.0.x` tags) until `v1.1.0` is ready.
            - `develop` — active feature development for the next minor
              release (`v1.1.0`). Merges into `main` only when ready to ship.
